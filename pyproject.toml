[project]
name = "wake"
version = "1.3.0"
description = "A Flasgo web app to turn on your computer using wake on lan"
authors = [
    {name = "Jay Townsend"}
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "flasgo[metrics]==0.6.0",
    "paramiko==5.0.0",
    "wakeonlan==4.0.0",
    "PyYaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "types-PyYAML==6.0.12.20250915",
    "ruff==0.15.21",
]

[tool.uv]
python-preference = "managed"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".eggs",
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".github",
    ".venv",
    ".vscode",
    ".idea",
    "__pypackages__",
    "build",
    "dist",
    "site-packages",
    "venv",
]

line-length = 130
target-version = "py314"
show-fixes = true

[tool.ruff.lint]
select = ["E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "TC",
    "RUF",
    "PT",
    "ASYNC",
    "B",
    "S",
    "SIM",
    ]
ignore = ["E721", "UP030"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests rely on assert, hard-coded sample credentials, and stubs that mirror asyncio signatures.
"tests/*" = ["S101", "S105", "S106", "S108", "ASYNC109"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

skip-magic-trailing-comma = false
line-ending = "auto"
