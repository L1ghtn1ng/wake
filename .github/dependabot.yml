- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
    timezone: Europe/London
  cooldown:
    default-days: 7
  patterns: ["*"]
  multi-ecosystem-group: all-dependencies
- package-ecosystem: uv
  directory: "/"
  schedule:
    interval: daily
    timezone: Europe/London
  cooldown:
    default-days: 7
  patterns: ["*"]
  multi-ecosystem-group: all-dependencies
  allow:
  - dependency-type: direct
  - dependency-type: indirect
